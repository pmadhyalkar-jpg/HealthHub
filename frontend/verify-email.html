<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email | HealthHub</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="assets/css/main.css"></head><body><div id="disclaimer-banner-placeholder"></div><div id="navbar-placeholder"></div><main class="section"><div class="container" style="max-width:620px"><div class="card" style="padding:2rem;text-align:center"><div class="icon-box" style="margin:0 auto 1rem"><i class="fas fa-envelope-circle-check"></i></div><h2>Email verification</h2><p id="verification-message" style="margin:1rem 0;color:var(--text-secondary)">Checking your verification link…</p><a id="login-link" class="btn btn-primary" href="login.html" style="display:none">Continue to sign in</a></div></div></main><div id="footer-placeholder"></div><script src="assets/js/api.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{HealthHub.renderDisclaimerBanner();HealthHub.renderNavbar();HealthHub.renderFooter();const message=document.getElementById('verification-message');const link=document.getElementById('login-link');const token=new URLSearchParams(location.search).get('token');if(!token){message.textContent='The verification link is missing. Please use the link from your email.';return;}try{const res=await HealthHub.request('/api/auth/verify-email',{method:'POST',body:JSON.stringify({token})});message.textContent=res.message;link.style.display='inline-flex';}catch(e){message.textContent=e.message||'This verification link is invalid or expired. Please request a new link.';link.textContent='Back to sign in';link.style.display='inline-flex';}});</script></body></html>
